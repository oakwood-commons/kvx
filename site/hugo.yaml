# Hugo Configuration for oakwood-commons/kvx
# Documentation: https://gohugo.io/getting-started/configuration/
# Note: Hugo runs from site/ so its theme go.mod stays isolated from the root Go module.

baseURL: "https://kvx.oakwood-commons.org/"
languageCode: "en-us"
title: "kvx"
enableRobotsTXT: true

# Output to the root public/ directory (consumed by the GitHub Pages CI step)
publishDir: "../public"

# Use Hugo Modules for theme (no git submodule needed)
module:
  imports:
    - path: github.com/alex-shpak/hugo-book
  mounts:
    - source: ../docs
      target: content/docs
    - source: ../home
      target: content
    - source: ../assets
      target: assets
    - source: ../layouts
      target: layouts
    - source: ../static
      target: static

# Repository information
params:
  description: "Interactive terminal UI, schema-driven explorer, and CEL query engine for structured data"
  github_repo: "https://github.com/oakwood-commons/kvx"
  github_project_repo: "https://github.com/oakwood-commons/kvx"

  # Book theme specific
  BookTheme: "blueprint"
  BookLogo: "images/symbol.svg"
  BookFavicon: "favicon.svg"
  BookSection: docs
  BookRepo: "https://github.com/oakwood-commons/kvx"
  BookEditLink: 'https://github.com/oakwood-commons/kvx/edit/main/{{ $p := replace .Page.File.Path "\\" "/" }}{{ if hasPrefix $p "docs/" }}{{ $p }}{{ else }}home/{{ $p }}{{ end }}'
  BookDateFormat: "January 2, 2006"
  BookSearch: true
  BookComments: false
  BookToC: true

# Enable syntax highlighting and raw Blueprint HTML blocks
markup:
  highlight:
    style: github-dark
    lineNos: false
    codeFences: true
    guessSyntax: true
  goldmark:
    extensions:
      typographer: false
    renderer:
      unsafe: true

# Menu structure
menu:
  before: []
  after:
    - name: "GitHub Repository"
      url: "https://github.com/oakwood-commons/kvx"
      weight: 10
    - name: "Releases"
      url: "https://github.com/oakwood-commons/kvx/releases"
      weight: 20
    - name: "Go Reference"
      url: "https://pkg.go.dev/github.com/oakwood-commons/kvx"
      weight: 30
