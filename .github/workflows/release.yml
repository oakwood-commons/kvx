name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write # Required for cosign keyless signing via OIDC

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x

      - name: Run tests
        run: task test

      - name: Run linter
        run: task lint

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x

      - name: Run tests
        run: task test

  release:
    name: Release
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OC_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.OC_AUTOMATION_APP_PRIVATE_KEY }}
          owner: oakwood-commons
          repositories: homebrew-tap

      - name: Generate winget token
        id: winget-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OC_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.OC_AUTOMATION_APP_PRIVATE_KEY }}
          owner: oakwood-commons
          repositories: winget-pkgs

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          WINGET_GITHUB_TOKEN: ${{ steps.winget-token.outputs.token }}

      - name: Submit winget PR
        if: success()
        env:
          WINGET_PR_PAT: ${{ secrets.WINGET_PR_PAT }}
          GH_TOKEN: ${{ secrets.WINGET_PR_PAT }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          BRANCH="kvx-${VERSION}"

          # Skip prerelease tags (goreleaser skips winget for prereleases)
          if [[ "$VERSION" == *-* ]]; then
            echo "::notice::Skipping winget PR for prerelease version $VERSION"
            exit 0
          fi

          if [ -z "$WINGET_PR_PAT" ]; then
            echo "::warning::No WINGET_PR_PAT secret found. Winget PR must be submitted manually."
            echo "::notice::Run locally: task winget-pr"
            exit 0
          fi

          echo "Creating winget PR with token..."
          BODY_FILE="$(mktemp)"
          printf '## Automated winget manifest update\n\nRelease: https://github.com/oakwood-commons/kvx/releases/tag/%s\n' "$TAG" > "$BODY_FILE"

          if gh pr create \
            --repo microsoft/winget-pkgs \
            --head "oakwood-commons:$BRANCH" \
            --base master \
            --title "New version: OakwoodCommons.kvx version $VERSION" \
            --body-file "$BODY_FILE"; then
            echo "::notice::Winget PR created successfully."
          else
            echo "::warning::Failed to create winget PR. It may already exist or there was a transient API issue. Submit manually with: task winget-pr"
          fi
          rm -f "$BODY_FILE"
